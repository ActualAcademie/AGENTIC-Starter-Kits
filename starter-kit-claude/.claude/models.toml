schema_version = 1

[profiles.orchestration]
model = "opus"
reasoning_effort = "high"
fallback_model = "sonnet"
fallback_reasoning_effort = "high"
purpose = "Coordination multi-étapes, arbitrage et architecture complexe"

[profiles.coding]
model = "sonnet"
reasoning_effort = "medium"
fallback_model = "opus"
fallback_reasoning_effort = "high"
purpose = "Implémentation, tests et revue de code"

[profiles.audit]
model = "sonnet"
reasoning_effort = "high"
fallback_model = "opus"
fallback_reasoning_effort = "high"
purpose = "Audit indépendant, régression et analyse de sécurité"

[profiles.critical]
model = "opus"
reasoning_effort = "high"
fallback_model = "sonnet"
fallback_reasoning_effort = "high"
purpose = "Décisions critiques, incident, sécurité et irréversibilité"

[profiles.routine]
model = "sonnet"
reasoning_effort = "low"
fallback_model = "sonnet"
fallback_reasoning_effort = "low"
purpose = "Tâches répétitives, classification, extraction et documentation à faible risque"

[role_defaults]
coordinateur = "orchestration"
concepteur = "orchestration"
frontend = "coding"
backend = "coding"
cybersecurite = "audit"
auditeur = "audit"

[risk_override]
low = "routine"
elevated = "audit"
critical = "critical"

[policy]
use_critical_only_when_required = true
prefer_cached_context = true
allow_fallback_if_primary_unavailable = true
review_after_model_change = true
