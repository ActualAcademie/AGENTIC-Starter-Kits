name: Publish release and repository about

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  discussions: write

jobs:
  publish:
    name: Publish release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "v$version" = "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN || github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release déjà présente : $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Agentic Starter Kits $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

      - name: Update repository description
        if: ${{ secrets.REPO_SETTINGS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN || github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" \
            --field description='Starter kits premium et portables pour orchestrer des projets logiciels avec Codex ou Claude, avec gouvernance, sécurité, GitFlow, CI et mises à jour contrôlées.'

      - name: Update repository topics
        if: ${{ secrets.REPO_SETTINGS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN || github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" \
            --header 'Accept: application/vnd.github+json' \
            --input - <<'JSON'
          {"names":["ai-agents","agentic-workflows","codex","claude-code","developer-tools","software-architecture","gitflow","github-actions","security","starter-kit"]}
          JSON
